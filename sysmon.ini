; sysmon settings. Remove a line to use its built-in default; the README's "Settings
; file" section lists them. All values here are the defaults except battery_warn and
; battery_low (defaults 50 and 20).

[sections]
; Which sections the main view shows: yes or no. Hidden sections are still
; measured, so their graphs (F2) and --log / --json output keep working.
cpu = yes
memory = yes
gpu = yes
disks = yes
network = yes
battery = yes
sensors = yes

[thresholds]
; Bars and values turn from "ok" to "warn" to "high" at these levels.
usage_warn = 60
usage_high = 85
temperature_warn = 60
temperature_high = 80
; The battery bar turns "warn" below battery_warn and "high" below battery_low.
battery_warn = 30
battery_low = 10

[colors]
; black, red, green, yellow, blue, magenta, cyan, white, or bright_ plus one of those
; (bright_black is gray). A raw ANSI color code such as 38;5;208 works too.
; Plain yellow shows as white in PowerShell's blue console, hence bright_yellow.
ok = green
warn = bright_yellow
high = red
accent = cyan
; The empty part of the bars
track = bright_black
